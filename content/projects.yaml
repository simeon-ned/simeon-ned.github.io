    - type: image
      src: images/projects/wbc-mjlab-getup.gif
      alt: WBC-Mjlab get up
      href: https://wbc-mjlab.github.io/wbc-demo/
  body_html: |
    One shared MDP for whole-body motion tracking in
    <a href="https://github.com/mujocolab/mjlab" target="_blank" rel="noopener noreferrer">mjlab</a> — train once
    on a motion library, deploy one policy for many skills. Multi-clip training, paper-specific task presets,
    and sim-to-real export.
  cv_html: |
    shared MDP for universal whole-body motion tracking in mjlab: multi-clip training, paper-specific task presets (ZEST,
    BeyondMimic-style RSI, etc.), motion-data pipeline, and sim-to-real export for humanoids.
