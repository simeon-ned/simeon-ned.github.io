    - type: image
      src: images/projects/wbc-mjlab-getup.gif
      alt: WBC-Mjlab get up
      href: https://wbc-mjlab.github.io/
  body_html: |
    One shared MDP for whole-body motion tracking in
    <a href="https://github.com/mujocolab/mjlab" target="_blank" rel="noopener noreferrer">mjlab</a> —
    train once on a motion library, then deploy one policy across many skills. Supports multi-clip training,
    paper-specific task presets, and sim-to-real export.
  cv_html: |
    shared MDP for whole-body motion tracking in mjlab: multi-clip training, paper-specific task presets (ZEST,
    BeyondMimic-style RSI, and related setups), motion-data pipeline, and sim-to-real export for humanoids.
