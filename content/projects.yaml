- id: psm
  title: "PSM: Predictive Style Matching for Natural Locomotion"
  title_url: https://simeon-ned.github.io/predictive-style-matching/
  thumbs: landscape
  media:
    - type: image
      src: images/projects/psm-walk.gif
      alt: PSM walking on hardware
      href: https://simeon-ned.github.io/predictive-style-matching/
    - type: image
      src: images/projects/psm-disturbance.gif
      alt: PSM disturbance recovery
      href: https://simeon-ned.github.io/predictive-style-matching/
  body_html: |
    Natural and robust humanoid locomotion via an offline predictor that maps lower-body state and velocity
    commands to upper-body and gait targets during RL training — preserving task-only deployment on Unitree G1.
  meta: Simeon Nedelchev, Ekaterina Chaikovskaia, Egor Davydenko, Eduard Zaliaev, Roman Gorbachev · 2026 preprint
  cv_html: |
    offline predictor maps lower-body state and velocity commands to upper-body and gait targets during RL training;
    deployed on Unitree G1 with task-only inference at run time. arXiv:2606.07083 (2026).
  cv_extra_links:
    - label: project page
      href: https://simeon-ned.github.io/predictive-style-matching/
  links:
    - label: Project page
      href: https://simeon-ned.github.io/predictive-style-matching/
    - label: Paper
      href: https://arxiv.org/abs/2606.07083
    - label: Code
      href: https://github.com/simeon-ned/predictive-style-matching

- id: sber-green
  title: Locomotion and Whole Body Control for Sber Green
  thumbs: sber-grid
  media:
    - type: sber
  body_html: |
    Core senior engineer for RL locomotion and whole-body control on the Green humanoid at AIJ
    2025: <span class="kw">predictor-based human-like locomotion</span>; unified WBC for teleoperation,
    dance, and zero-shot skills; motor &amp; actuator system identification for MuJoCo simulation.
  cv_html: |
    developer of the RL locomotion and whole-body control policies demonstrated on the Green humanoid at AIJ
    2025: improved naturalness and human-likeness of locomotion; RL-based whole-body control trained on
    synthetically generated reference trajectories (without acquiring mocap
    datasets or retargeting) and unified tracking for teleoperation, dance, and zero-shot skills.
  cv_extra_links:
    - label: AIJ 2025 presentation
      href: https://youtu.be/eehll8Uw3pw?t=1432
  links:
    - label: Presentation
      href: https://youtu.be/eehll8Uw3pw?t=1432
  show_on_cv: true

- id: mink-warp
  title: "mink-warp: Batched Differential IK on MuJoCo Warp"
  title_url: https://github.com/simeon-ned/mink-warp
  thumbs: landscape
  show_on_cv: false
  media:
    - type: video
      src: images/projects/mink-warp-cassie.mp4
      width: 219
      height: 123
      aria: Cassie equality-constraint IK demo
      href: https://github.com/simeon-ned/mink-warp
  body_html: |
    Batched differential inverse kinematics on
    <a href="https://github.com/google-deepmind/mujoco_warp" target="_blank" rel="noopener noreferrer">MuJoCo Warp</a>
    with a
    <a href="https://github.com/kevinzakka/mink" target="_blank" rel="noopener noreferrer">Mink</a>-shaped API:
    GPU-parallel task-space IK for many worlds at once — frame tasks, posture, COM, equality constraints for
    closed chains, and hard limits via GPU ADMM. CUDA graph capture for real-time loops; Panda, UR5e, Cassie,
    dual iiwa, and G1 examples.
  links:
    - label: Docs
      href: https://simeon-ned.github.io/mink-warp/
    - label: Code
      href: https://github.com/simeon-ned/mink-warp
    - label: PyPI
      href: https://pypi.org/project/mink-warp/
