# Featured research / software projects (homepage + CV selected list)
- id: wbc-gen
  title: "WBC-Gen: Reactive Generative Motion Planner"
  title_url: https://wbc-mjlab.github.io/wbc-demo/
  thumbs: portrait
  media:
    - type: video
      src: images/projects/wbc-gen-walk.mp4
      aria: WBC-Gen walking on Unitree G1
    - type: video
      src: images/projects/wbc-gen-disturbance.mp4
      aria: WBC-Gen disturbance recovery on Unitree G1
  body_html: |
    Fast proprio-conditioned latent flow-matching planner that sits next to a frozen whole-body controller and
    turns high-level intent into trackable WBC references — reactive, physics- and controller-aware generation
    rather than open-loop playback. Lightweight enough for Gen and WBC to co-locate on the Unitree G1 onboard
    CPU (no Jetson), and generalizable across tasks on one unified WBC contract. Beyond locomotion teleop, the
    same planner can
    <a href="https://youtu.be/gAHCAtJnRDU" target="_blank" rel="noopener noreferrer">autonomously recover and get up from failed states</a>
    without a fall/standing mode FSM. On hardware:
    <a href="https://youtube.com/shorts/dXNI8benYAo" target="_blank" rel="noopener noreferrer">walk&nbsp;/&nbsp;sprint teleop</a>,
    <a href="https://youtube.com/shorts/iofTKa0GPwQ" target="_blank" rel="noopener noreferrer">disturbance rejection</a>,
    and
    <a href="https://youtube.com/shorts/aMezmX262tg" target="_blank" rel="noopener noreferrer">agile recovery</a>.
    <a href="https://wbc-mjlab.github.io/wbc-demo/" target="_blank" rel="noopener noreferrer">Try Gen alongside WBC tracking</a>
    to interactively generate robot locomotion (WASD to steer, Shift to sprint; press G to switch clips&nbsp;↔&nbsp;Gen).
    Training code and paper coming soon.
  cv_html: |
    fast proprio-conditioned latent flow-matching planner that emits trackable WBC references for a frozen
    whole-body controller; generalizable across tasks on one unified WBC contract; can
    <a href="https://youtu.be/gAHCAtJnRDU" target="_blank" rel="noopener noreferrer">autonomously recover and get up from failed states</a>
    without a fall/standing mode FSM. Gen and WBC co-located on the Unitree G1 onboard CPU, with
    <a href="https://youtube.com/shorts/dXNI8benYAo" target="_blank" rel="noopener noreferrer">walk&nbsp;/&nbsp;sprint teleop</a>,
    <a href="https://youtube.com/shorts/iofTKa0GPwQ" target="_blank" rel="noopener noreferrer">disturbance rejection</a>,
    and
    <a href="https://youtube.com/shorts/aMezmX262tg" target="_blank" rel="noopener noreferrer">agile recovery</a>
    on hardware.
    <a href="https://wbc-mjlab.github.io/wbc-demo/" target="_blank" rel="noopener noreferrer">Try Gen alongside WBC tracking</a>
    to interactively generate robot locomotion (WASD to steer, Shift to sprint; G switches clips&nbsp;↔&nbsp;Gen);
    deploy code in
    <a href="https://github.com/wbc-mjlab/wbc-g1-deploy/tree/feat/generator" target="_blank" rel="noopener noreferrer">wbc-g1-deploy</a>;
    training code and paper coming soon.
  links:
    - label: Demo
      href: https://wbc-mjlab.github.io/wbc-demo/
    - label: Deploy Code
      href: https://github.com/wbc-mjlab/wbc-g1-deploy/tree/feat/generator
    - label: Simulation
      href: https://youtu.be/gAHCAtJnRDU

- id: wbc-mjlab
  title: "WBC-Mjlab: Whole Body Control in MuJoCo Lab"
  title_url: https://github.com/wbc-mjlab/wbc-mjlab
  thumbs: portrait
  media:
    - type: image
      src: images/projects/wbc-mjlab-sideflip.gif
