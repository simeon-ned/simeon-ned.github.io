name: Deploy site

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generate before TeX container (needs Node + citation-js from npm ci)
      - name: Generate CV publications from BibTeX
        run: node scripts/generate-cv-pubs.js

      - name: Build CV PDF
        uses: xu-cheng/texlive-action@v2
        with:
          scheme: small
          packages: latexmk geometry lmodern microtype enumitem titlesec hyperref xcolor tools lm
          run: |
            cd cv && latexmk -pdf -interaction=nonstopmode cv.tex
            cp cv.pdf ../pdf/CV.pdf
            test -f ../pdf/CV.pdf

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
